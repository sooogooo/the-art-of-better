<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f0e6"/><g fill="#dae2d4" stroke="#193846" stroke-width="3"><rect width="700" height="70" x="250" y="500"/><rect width="600" height="70" x="350" y="410"/><rect width="500" height="70" x="450" y="320"/><rect width="400" height="70" x="550" y="230"/></g><g fill="#193846" font-family="Noto Serif CJK SC,serif" text-anchor="middle"><text x="600" y="125" font-size="36">期待的梯子</text><text x="600" y="545" font-size="25">我想改善什么</text><text x="650" y="455" font-size="25">它可能改善什么</text><text x="700" y="365" font-size="25">它不能承诺什么</text><text x="750" y="275" font-size="25">我不要求它证明什么</text><text x="600" y="650" font-size="23">把愿望说清，不把人生交给结果</text></g></svg>