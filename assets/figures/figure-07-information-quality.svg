<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f0e6"/><g fill="#dae2d4" stroke="#193846" stroke-width="3"><rect x="170" y="245" width="190" height="210"/><rect x="400" y="245" width="190" height="210"/><rect x="630" y="245" width="190" height="210"/><rect x="860" y="245" width="190" height="210"/></g><g fill="#193846" font-family="Noto Serif CJK SC,serif" text-anchor="middle"><text x="600" y="130" font-size="36">面诊的信息质量</text><text x="265" y="335" font-size="29">愿望</text><text x="495" y="335" font-size="29">事实</text><text x="725" y="335" font-size="29">未知项</text><text x="955" y="335" font-size="29">退出权</text><text x="265" y="390" font-size="19">我在意什么</text><text x="495" y="390" font-size="19">可核对什么</text><text x="725" y="390" font-size="19">仍需沟通什么</text><text x="955" y="390" font-size="19">我可以再想</text><text x="600" y="600" font-size="24">完整信息不是压迫式信息；它必须允许提问与离开</text></g></svg>
