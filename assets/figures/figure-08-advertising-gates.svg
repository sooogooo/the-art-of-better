<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f0e6"/><g fill="#dae2d4" stroke="#193846" stroke-width="4"><path d="M180 250h220v240H180z"/><path d="M490 250h220v240H490z"/><path d="M800 250h220v240H800z"/></g><g fill="#193846" font-family="Noto Serif CJK SC,serif" text-anchor="middle"><text x="600" y="130" font-size="36">广告到决定的三道门</text><text x="290" y="350" font-size="29">识别</text><text x="600" y="350" font-size="29">核对</text><text x="910" y="350" font-size="29">延迟</text><text x="290" y="410" font-size="20">它触发了什么</text><text x="600" y="410" font-size="20">它省略了什么</text><text x="910" y="410" font-size="20">两周后还想吗</text><text x="600" y="610" font-size="24">广告是线索，不是诊断，也不是命令</text></g></svg>